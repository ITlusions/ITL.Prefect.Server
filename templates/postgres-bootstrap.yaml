# One-time bootstrap for generated credentials.
# Runs as a Helm pre-install/pre-upgrade hook (Argo CD maps these to PreSync).
# It creates two Secrets, each only when it does not exist yet, so the values
# stay stable across syncs:
#   - prefect-postgres: database password and connection string
#   - prefect-server-basic-auth: keys "username" (random admin user) and
#     "auth-string" ("<username>:<password>", used by the server)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prefect-postgres-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prefect-postgres-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["prefect-postgres", "prefect-server-basic-auth"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prefect-postgres-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prefect-postgres-bootstrap
subjects:
  - kind: ServiceAccount
    name: prefect-postgres-bootstrap
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-postgres-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prefect-postgres-bootstrap
    spec:
      serviceAccountName: prefect-postgres-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: {{ .Values.postgres.bootstrap.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              # random_password: 32 alphanumeric characters (safe in URLs and basic auth)
              random_password() {
                head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32
              }

              if kubectl get secret prefect-postgres -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "Secret prefect-postgres already exists, keeping the current password"
              else
                PASSWORD=$(random_password)
                kubectl create secret generic prefect-postgres -n "$NAMESPACE" \
                  --from-literal=password="$PASSWORD" \
                  --from-literal=connection-string="postgresql+asyncpg://${POSTGRES_USER}:${PASSWORD}@prefect-postgres.${NAMESPACE}:5432/${POSTGRES_DB}"
                echo "Created secret prefect-postgres"
              fi

              if kubectl get secret prefect-server-basic-auth -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "Secret prefect-server-basic-auth already exists, keeping the current credential"
              else
                # random admin user: <prefix>-<8 lowercase characters>, so the name is not guessable
                AUTH_USER="${BASIC_AUTH_USERNAME_PREFIX}-$(head -c 256 /dev/urandom | tr -dc 'a-z0-9' | head -c 8)"
                AUTH_PASSWORD=$(random_password)
                kubectl create secret generic prefect-server-basic-auth -n "$NAMESPACE" \
                  --from-literal=username="$AUTH_USER" \
                  --from-literal=auth-string="${AUTH_USER}:${AUTH_PASSWORD}"
                echo "Created secret prefect-server-basic-auth"
              fi
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: BASIC_AUTH_USERNAME_PREFIX
              value: {{ .Values.basicAuth.usernamePrefix | quote }}
